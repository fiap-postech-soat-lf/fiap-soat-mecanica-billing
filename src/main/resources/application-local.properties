# Perfil local: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Infra local: docker compose -f ../fiap-soat-mecanica-k8s/local/docker-compose.yml up -d
server.port=8083
logging.level.br.com.fiap.soat.mecanica=DEBUG
management.otlp.metrics.export.enabled=false

# Chave publica de dev gerada por local/jwt/gerar-chaves-dev.sh no -k8s
app.security.jwt.public-key=file:../fiap-soat-mecanica-k8s/local/jwt/dev-public.pem

# LocalStack
app.aws.endpoint=http://localhost:4566
app.aws.access-key-id=test
app.aws.secret-access-key=test
# Destino das respostas e eventos do Billing (topico criado pelo 01-mensageria.sh do -k8s)
app.messaging.destinos.billing-eventos=arn:aws:sns:us-east-1:000000000000:mecanica-billing-eventos

# Fila de comandos do Billing no LocalStack (nome da tabela 3.4) e a DLQ dela
app.messaging.consumidor.filas=http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/mecanica-billing-comandos
app.messaging.dlqs=http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/mecanica-billing-comandos-dlq

spring.datasource.url=jdbc:postgresql://localhost:5435/billing
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.show-sql=true
