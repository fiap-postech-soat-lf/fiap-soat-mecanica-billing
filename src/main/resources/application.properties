spring.application.name=mecanica-billing
spring.threads.virtual.enabled=true
server.forward-headers-strategy=framework
app.versao=${DD_VERSION:dev}

# Actuator (health com probes, como no monolito)
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.enabled=${METRICS_EXPORT_ENABLED:true}
management.metrics.tags.service=${spring.application.name}
management.metrics.distribution.percentiles-histogram.mensagem.atraso=true

# Logs (do monolito)
logging.level.br.com.fiap.soat.mecanica=INFO
logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name}

# JWT (RS256, emitido pelo Identity)
app.security.jwt.public-key=${JWT_PUBLIC_KEY:}
app.security.jwt.issuer=fiap-soat-mecanica-identity
app.security.jwt.audience=fiap-soat-mecanica

# AWS e mensageria (valores do ConfigMap gerado pelo output app_config do Terraform)
app.aws.region=${AWS_REGION:us-east-1}
app.aws.endpoint=${AWS_ENDPOINT_URL:}
app.messaging.consumidor.enabled=${MESSAGING_CONSUMER_ENABLED:true}
# URLs separadas por virgula; no EKS chegam como APP_MESSAGING_CONSUMIDOR_FILAS e APP_MESSAGING_DLQS
app.messaging.consumidor.filas=
app.messaging.dlqs=
# Destinos de publicacao (ARN de topico ou URL de fila), um por nome logico, ex.:
# app.messaging.destinos.execucao-comandos=${MESSAGING_DESTINO_EXECUCAO_COMANDOS:}
app.messaging.destinos.billing-eventos=${MESSAGING_DESTINO_BILLING_EVENTOS:}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Orcamento (F6-f): o Billing e dono do prazo; PT24H no EKS, PT2M no perfil demo
app.orcamento.ttl=PT24H
app.orcamento.expiracao.intervalo=PT30S

# Mercado Pago (F6-b, F6-g): o token vem do app_secrets (MP_ACCESS_TOKEN) e nunca de arquivo
app.mercadopago.base-url=https://api.mercadopago.com
app.mercadopago.access-token=${MP_ACCESS_TOKEN:}
# Segredo da assinatura do webhook (F6-i); sem ele o webhook responde 401
app.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
app.mercadopago.timeout=PT5S
app.mercadopago.retry.max-tentativas=3
app.mercadopago.retry.espera-inicial=500ms
app.mercadopago.retry.multiplicador=2
# init_point ou sandbox_init_point
app.mercadopago.link=init_point

# Webhook do Mercado Pago (F6-i): processador a cada 2 s, ate 5 tentativas com backoff 2^n s
app.webhook.processador.intervalo=PT2S
app.webhook.processador.max-tentativas=5
