management.otlp.metrics.export.enabled=false
app.messaging.consumidor.enabled=false

# A chave publica e os containers sao injetados pelo IntegracaoTest (DynamicPropertySource).
app.aws.access-key-id=test
app.aws.secret-access-key=test

spring.jpa.show-sql=false

# Orcamento: vence em 2 s e o scheduler roda a cada 1 s (OrcamentoSagaIT, ExpiracaoOrcamentoIT)
app.orcamento.ttl=PT2S
app.orcamento.expiracao.intervalo=PT1S

# Mercado Pago: a URL base e o WireMock estatico do IntegracaoTest; retry sem espera longa
app.mercadopago.access-token=token-mp-de-teste
app.mercadopago.retry.espera-inicial=10ms
app.mercadopago.webhook-secret=segredo-webhook-de-teste

# Webhook: o processador roda a cada 1 s (WebhookIT)
app.webhook.processador.intervalo=PT1S
